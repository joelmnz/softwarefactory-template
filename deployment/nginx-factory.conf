# Factory (MastraCode Web) — LAN HTTPS reverse proxy.
#
# MANAGED-BY: install-local-https.sh — this file is overwritten in full on
# every run of that script; hand edits here will be lost. The marker is also
# how the installer detects (and refuses to clobber) an unmanaged Factory
# site placed at the same path by hand or by another tool.
#
# Installed to /etc/nginx/sites-available/factory (symlinked from
# /etc/nginx/sites-enabled/factory). sites-enabled/* is included inside
# nginx's `http` context, so the `map` block below is valid here; its
# variable name is Factory-specific to avoid colliding with any other
# site's maps.
#
# Leaf certificate: issued by the "Janet LAN Paperclip CA"
# (/home/joelai/apps/paperclip/tls/ca.crt). The CA private key is never
# copied or moved by this file or the installer — the installer only runs a
# stat-level readability check on it and hands its PATH to openssl for
# signing; it never reads the key's contents. The installer places the leaf
# key/cert here:
#   /etc/nginx/ssl/factory.janet.localdev.crt  (0644)
#   /etc/nginx/ssl/factory.janet.localdev.key  (0600, root-owned)
#
# The app itself stays on loopback: compose binds 127.0.0.1:4112 -> container
# 4111. LAN devices reach the app only through https://factory.janet.localdev.

# WebSocket upgrade mapping (http context, Factory-unique variable name):
# non-empty Upgrade header -> "upgrade", empty/absent -> "close".
map $http_upgrade $factory_connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain-HTTP listener: redirect to HTTPS inside a LAN-restricted location.
# Server-selection caveat (why "exact host" would be misleading): nginx
# matches a request's Host header against server_name values across ALL
# server blocks on 192.168.1.215:80. This block receives requests for
# Host: factory.janet.localdev, AND any request whose Host matches no
# server_name on that address:port if nginx picks this block as the default
# (first-listed) server for it. Other named hosts keep their own existing
# server blocks (paperclip and friends) — this file does not touch them.
server {
    listen 192.168.1.215:80;
    server_name factory.janet.localdev;

    location / {
        # Same LAN allowlist as the TLS listener: non-LAN clients get 403 on
        # port 80 instead of a redirect.
        allow 192.168.1.0/24;
        allow 127.0.0.1;
        deny all;

        return 301 https://factory.janet.localdev$request_uri;
    }
}

server {
    listen 192.168.1.215:443 ssl http2;
    server_name factory.janet.localdev;

    ssl_certificate     /etc/nginx/ssl/factory.janet.localdev.crt;
    ssl_certificate_key /etc/nginx/ssl/factory.janet.localdev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:factory_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # LAN-only. Anything outside the host's subnet (or loopback) is refused.
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:4112;

        # Forwarded identity. X-Forwarded-For is set to the *direct* client
        # address ($remote_addr), overwriting any client-supplied value
        # instead of appending to it ($proxy_add_x_forwarded_for) — a LAN
        # client must not be able to spoof its source address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSockets (live agent streams / UI updates).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $factory_connection_upgrade;

        # Streaming responses (SSE / long agent turns): no buffering, and
        # generous read timeouts so long-running requests are not cut off.
        proxy_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
