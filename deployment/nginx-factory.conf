# Factory (MastraCode Web) — LAN HTTPS reverse proxy.
#
# Installed by deployment/install-local-https.sh to
# /etc/nginx/sites-available/factory (symlinked from /etc/nginx/sites-enabled/factory).
# sites-enabled/* is included inside nginx's `http` context, so the `map`
# block below is valid here; its variable name is Factory-specific to avoid
# colliding with any other site's maps.
#
# Leaf certificate: issued by the "Janet LAN Paperclip CA"
# (/home/joelai/apps/paperclip/tls/ca.crt). The CA private key is never
# copied, moved, or read by this file or the installer — the installer only
# references its path for signing and places the leaf key/cert here:
#   /etc/nginx/ssl/factory.janet.localdev.crt  (0644)
#   /etc/nginx/ssl/factory.janet.localdev.key  (0600, root-owned)
#
# The app itself stays on loopback: compose binds 127.0.0.1:4112 -> container
# 4111. LAN devices reach the app only through https://factory.janet.localdev.

# WebSocket upgrade mapping (http context, Factory-unique variable name):
# non-empty Upgrade header -> "upgrade", empty/absent -> "close".
map $http_upgrade $factory_connection_upgrade {
    default upgrade;
    ''      close;
}

# Plain-HTTP listener: exact-host redirect to HTTPS. Only requests whose
# Host is exactly factory.janet.localdev land here; every other :80 host on
# 192.168.1.215 keeps hitting its own existing server block (paperclip and
# friends) — this file does not touch them.
server {
    listen 192.168.1.215:80;
    server_name factory.janet.localdev;

    return 301 https://factory.janet.localdev$request_uri;
}

server {
    listen 192.168.1.215:443 ssl http2;
    server_name factory.janet.localdev;

    ssl_certificate     /etc/nginx/ssl/factory.janet.localdev.crt;
    ssl_certificate_key /etc/nginx/ssl/factory.janet.localdev.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:factory_ssl:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # LAN-only. Anything outside the host's subnet (or loopback) is refused.
    allow 192.168.1.0/24;
    allow 127.0.0.1;
    deny all;

    location / {
        proxy_pass http://127.0.0.1:4112;

        # Forwarded identity. X-Forwarded-For is set to the *direct* client
        # address ($remote_addr), overwriting any client-supplied value
        # instead of appending to it ($proxy_add_x_forwarded_for) — a LAN
        # client must not be able to spoof its source address.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        # WebSockets (live agent streams / UI updates).
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $factory_connection_upgrade;

        # Streaming responses (SSE / long agent turns): no buffering, and
        # generous read timeouts so long-running requests are not cut off.
        proxy_buffering off;
        proxy_read_timeout  300s;
        proxy_send_timeout  300s;
    }
}
