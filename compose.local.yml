# Local Docker deployment of MastraCode Web (spike) — app + pgvector database.
#
# This file does NOT replace the official docker-compose.yml (local dev
# backing services); it is a separate, self-contained deployment for running
# the packaged app locally.
#
# Usage (see LOCAL-OPERATIONS.md):
#   docker compose --env-file .env.local -f compose.local.yml up -d --build
#
# Required env (from .env.local, supplied via --env-file and env_file):
#   POSTGRES_PASSWORD  — db superuser password (substitution variable)
#   DATABASE_URL       — app database connection; host must be `db`, e.g.
#                        postgres://user:PASS@db:5432/mastracode_web
#
# Security posture:
#   - app runs as uid 1000 (non-root), cap_drop ALL, no-new-privileges
#   - no Docker socket mounted
#   - app reachable only on host loopback 127.0.0.1:4112 (container 4111)
#   - db has no host port at all
name: mastracode-local

services:
  app:
    build: .
    image: mastracode-local:latest
    restart: unless-stopped
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    ports:
      # Host loopback 4112 -> container 4111 (Mastra server default port).
      - '127.0.0.1:4112:4111'
    environment:
      HOME: /home/node
      MASTRACODE_LOCAL_SANDBOX_ROOT: /sandboxes
    env_file:
      # App config comes from .env.local (generated by Janet; no secrets in
      # sources). Optional here only so `docker compose config` validates
      # before .env.local exists — at runtime it MUST exist and must contain
      # DATABASE_URL pointing at host `db`, or the app exits on boot.
      - path: .env.local
        required: false
    volumes:
      # Persistent state on the host, owned by uid 1000.
      - ./state/home:/home/node
      - ./state/sandboxes:/sandboxes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (docker compose --env-file .env.local)}
      POSTGRES_DB: ${POSTGRES_DB:-mastracode_web}
    volumes:
      # postgres:pg17 data lives at /var/lib/postgresql/data; the parent is
      # mounted so pg_upgrade-style version subdirs are supported.
      - ./state/postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-mastracode_web}']
      interval: 5s
      timeout: 5s
      retries: 5
    # NOTE: no `ports:` — the database is reachable only inside the compose
    # network. The official docker-compose.yml (dev) exposes 54329; this
    # deployment intentionally does not.
