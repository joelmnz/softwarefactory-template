# Local Docker deployment of MastraCode Web (spike) — app + pgvector database.
#
# This file does NOT replace the official docker-compose.yml (local dev
# backing services); it is a separate, self-contained deployment for running
# the packaged app locally.
#
# Usage (see LOCAL-OPERATIONS.md):
#   docker compose --env-file .env.local -f compose.local.yml up -d --build
#
# Required env (from .env.local, supplied via --env-file and env_file):
#   POSTGRES_PASSWORD  — db superuser password (substitution variable)
#   DATABASE_URL       — app database connection; host must be `db`, e.g.
#                        postgres://user:PASS@db:5432/mastracode_web
#
# Security posture:
#   - app runs as uid 1000 (non-root), cap_drop ALL, no-new-privileges
#   - no Docker socket mounted
#   - app binds only 127.0.0.1:4112 (container 4111) — NOT 0.0.0.0 and NOT
#     the LAN address. LAN devices reach the app through the nginx TLS
#     reverse proxy (deployment/nginx-factory.conf, installed by
#     deployment/install-local-https.sh) at https://factory.janet.localdev
#     (nginx listens on 192.168.1.215:443, restricted to the LAN subnet; its
#     :80 listener only issues a harmless public 301 redirect to HTTPS — and
#     terminates TLS with a leaf cert signed by the Janet LAN Paperclip CA).
#     Until that script has been applied and verified, the RUNNING
#     container may still hold the previous 192.168.1.215:4112 HTTP binding.
#   - db has no host port at all
name: mastracode-local

services:
  app:
    build: .
    image: mastracode-local:latest
    restart: unless-stopped
    user: '1000:1000'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 4g
    ports:
      # Loopback-only: container 4111 (Mastra server default port) is exposed
      # on host 127.0.0.1:4112 so ONLY the local nginx proxy can reach it.
      # nginx (deployment/nginx-factory.conf) terminates TLS for
      # https://factory.janet.localdev on 192.168.1.215:443 and proxies to
      # this loopback port — LAN browsers never talk plain HTTP to the app
      # (the :80 listener only 301-redirects the Factory host to HTTPS).
      # Until deployment/install-local-https.sh has been run and verified,
      # a still-running old container may hold the previous LAN binding
      # 192.168.1.215:4112 — see LOCAL-OPERATIONS.md for the current
      # runtime-vs-target status before entering any credentials.
      - '127.0.0.1:4112:4111'
    environment:
      HOME: /home/node
      MASTRACODE_LOCAL_SANDBOX_ROOT: /sandboxes
    env_file:
      # App config comes from .env.local (generated by Janet; no secrets in
      # sources). Required (fail closed): compose refuses to start the app
      # without it, and it must contain DATABASE_URL pointing at host `db` or
      # the app exits on boot.
      - path: .env.local
        required: true
    volumes:
      # Persistent state on the host, owned by uid 1000.
      - ./state/home:/home/node
      - ./state/sandboxes:/sandboxes
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    mem_limit: 1g
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set (docker compose --env-file .env.local)}
      POSTGRES_DB: ${POSTGRES_DB:-mastracode_web}
    volumes:
      # pg17 declares VOLUME /var/lib/postgresql/data — bind the declared
      # data dir itself so the image's anonymous volume can never shadow the
      # actual DB state on the host.
      - ./state/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-mastracode_web}']
      interval: 5s
      timeout: 5s
      retries: 5
    # NOTE: no `ports:` — the database is reachable only inside the compose
    # network. The official docker-compose.yml (dev) exposes 54329; this
    # deployment intentionally does not.
